name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^channel[[:space:]]*=/ {print $2; exit}' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::Could not read channel from rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.133

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (all targets, all features, pedantic)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings -D clippy::pedantic

      - name: cargo doc -D warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --all-features --no-deps --locked

      - name: cargo nextest run
        run: cargo nextest run --all-features --locked --no-fail-fast

      - name: cargo test doctests
        run: cargo test --doc --all-features --locked

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read Rust toolchain channel
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(awk -F'"' '/^channel[[:space:]]*=/ {print $2; exit}' rust-toolchain.toml)
          [ -n "$channel" ] || { echo "::error::Could not read channel from rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4

      - name: cargo deny check
        run: cargo deny check
