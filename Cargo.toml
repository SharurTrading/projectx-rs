[package]
name = "projectx-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "An async, provider-native Rust client for the ProjectX Gateway API"
repository = "https://github.com/SharurTrading/projectx-rs"
readme = "README.md"
license-file = "LICENSE"
keywords = ["projectx", "topstepx", "trading", "futures", "api-client"]
categories = ["api-bindings", "asynchronous", "network-programming"]
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust_decimal = { version = "1.37", features = ["serde-with-float"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
futures-util = "0.3"

[dev-dependencies]
httpmock = "0.8"
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
