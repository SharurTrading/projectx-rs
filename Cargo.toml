[package]
name = "projectx-client"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "An async, provider-native Rust client for the ProjectX Gateway API"
repository = "https://github.com/SharurTrading/projectx-rs"
homepage = "https://github.com/SharurTrading/projectx-rs"
documentation = "https://docs.rs/projectx-client"
readme = "README.md"
license = "MIT"
keywords = ["projectx", "topstepx", "trading", "futures", "api-client"]
categories = ["api-bindings", "asynchronous", "network-programming"]
publish = ["crates-io"]
include = [
    "/examples/**",
    "/src/**",
    "/tests/**",
    "/CHANGELOG.md",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/SECURITY.md",
]

[features]
default = []
live-tests = []

[dependencies]
data-encoding = { version = "2.11.0", default-features = false, features = ["alloc"] }
futures-util = "0.3.33"
httpdate = "1.0.3"
jiff = { version = "0.2.35", default-features = false, features = ["serde", "std"] }
parking_lot = "0.12.5"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rust_decimal = "1.42.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_repr = "0.1.21"
sha1 = { version = "0.11.0", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
httpmock = "0.8.3"
log = "0.4.33"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "test-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Public names such as `RealtimeClient` remain clearer than context-dependent
# abbreviations when imported from the crate root.
module_name_repetitions = "allow"
await_holding_lock = "deny"
expect_used = "deny"
unwrap_used = "deny"
